name: Data Pipeline

# Task 5 (Day 28-29): automate the pipeline.
# Runs on every push to main, once a week, and on demand.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib seaborn plotly openpyxl pymupdf scipy scikit-learn statsmodels

      - name: Run the automated pipeline
        working-directory: apexplanet-data-analytics-task-5
        run: python scripts/automate_pipeline.py

      - name: Rebuild the final report PDF
        working-directory: apexplanet-data-analytics-task-5
        run: python scripts/build_report.py

      - name: Upload the generated reports
        uses: actions/upload-artifact@v4
        with:
          name: task5-reports
          path: apexplanet-data-analytics-task-5/reports/
